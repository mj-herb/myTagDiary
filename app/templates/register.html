{% extends "base.html" %} {% block title %}Register{% endblock %} {% block
content %}
<form
  method="post"
  action="/register"
  class="p-4 border rounded mx-auto mt-5"
  style="max-width: 320px"
>
  <h2 class="mb-4 text-center">Register</h2>
  <div class="mb-3">
    <input
      type="text"
      name="username"
      class="form-control"
      placeholder="Username"
      required
      autofocus
    />
  </div>
  <div class="mb-3">
    <input
      type="email"
      name="email"
      class="form-control"
      placeholder="Email"
      required
    />
  </div>
  <div class="mb-3">
    <input
      type="password"
      name="password"
      class="form-control"
      placeholder="Password"
      required
      minlength="8"
    />
  </div>
  <button type="submit" class="btn btn-primary w-100">Sign Up</button>
  <div class="text-center mt-3">
    Already have an account? <a href="/login">Log in here</a>
  </div>
</form>
{% endblock %}
